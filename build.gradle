
buildscript {
    repositories {
        jcenter()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/maven' }
        maven { url = 'https://jitpack.io' }
        maven {
            name = "forge"
            url = "http://files.minecraftforge.net/maven"
        }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'

    }
}



apply plugin: 'net.minecraftforge.gradle'

apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'maven'

apply plugin: 'org.spongepowered.mixin'


version = "${mod_version}".toString()
group = "${mod_group}".toString() // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "${mod_id}".toString()

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8' // Need this here so eclipse task generates correctly.

minecraft {

    mappings channel: "${mappings_channel}".toString(), version: "${mappings_version}".toString()

    runs {
        client {
            workingDirectory project.file('run')


            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            property 'forge.logging.console.level', 'debug'
            arg '-torg.spongepowered.asm.launch.MixinTweaker'
            args '--tweakClass', 'org.spongepowered.asm.launch.MixinTweaker'
            property 'mixins.env.remapRefMap', 'true'

            jvmArgs += "-Dfml.coreMods.load=${mixins_forge_core_plugin_path}".toString()

            jvmArgs += "-Dfml.coreMods.load=zone.rong.mixinbooter.MixinBooterPlugin".toString()

        }

        server {

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            property 'forge.logging.console.level', 'debug'
            arg '-torg.spongepowered.asm.launch.MixinTweaker'
            args '--tweakClass', 'org.spongepowered.asm.launch.MixinTweaker'

            jvmArgs += "-Dfml.coreMods.load=${mixins_forge_core_plugin_path}".toString()

            jvmArgs += "-Dfml.coreMods.load=zone.rong.mixinbooter.MixinBooterPlugin".toString()

        }
    }
}


repositories {
    mavenCentral()
    maven {
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'CoFH Maven'
        url = 'https://maven.covers1624.net'
    }

    maven {
        url = 'https://jitpack.io'
    }
    maven {
        name = 'spongepowered-repo'
        url = 'https://repo.spongepowered.org/maven'
    }
    maven {
        url  = 'https://jitpack.io'
    }
    maven {
        name = 'CoFH Maven'
        url = 'https://maven.covers1624.net'
    }
}

configurations {
    embed
    compile.extendsFrom(embed)
}

dependencies {

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}".toString()

    implementation files('libs/NTM-Extended-1.12.2-2.0.2.jar')
    compileOnly files('libs/Galacticraft-1.12.2-4.0.7.jar')
    compileOnly files('libs/Baubles-1.12-1.5.2.jar')
    compileOnly files('libs/ToughAsNails-1.12.2-3.1.0.141-universal.jar')

    compileOnly files('libs/techguns-1.12.2-2.0.2.0_pre3.2.jar')

    implementation files('libs/IC2Classic-1.12.2-1.5.11.jar')
    implementation files('libs/ActuallyAdditions-1.12.2-r152.jar')

    implementation files('libs/Trinkets and Baubles-0.32.5.jar')

    compileOnly files('libs/Avaritia-1.12.2-3.3.0.37-universal.jar')

    implementation files('libs/tlskincape1.12.2-1.4.jar')

    embed('org.spongepowered:mixin:0.8.3-SNAPSHOT') {
        exclude module: 'guava'
        exclude module: 'commons-io'
        exclude module: 'gson'
    }

    implementation files('libs/!mixinbooter-10.6.jar')
    annotationProcessor files('libs/!mixinbooter-10.6.jar')

    annotationProcessor 'org.spongepowered:mixin:0.8.3:processor'

    compileOnly fg.deobf("cofh:RedstoneFlux:1.12-2.1.0.7:universal")

  //  implementation ('org.reflections:reflections:0.10.2')

}

ext {
    mod_id = "${mod_id}".toString()
    mod_name = "${mod_name}".toString()
    mod_version = "${mod_version}".toString()
    mod_author = "${mod_author}".toString()
    mod_description = "${mod_description}".toString()
    mod_url = "${mod_url}".toString()
    mod_credits = "${mod_credits}".toString()
    minecraft_version = "${minecraft_version}".toString()
}

processResources {

    inputs.property "version", mod_version
    inputs.property "modid", mod_id

    filesMatching("mcmod.info") {
        expand(
                mod_id: mod_id,
                mod_name: mod_name,
                mod_version: mod_version,
                mod_author: mod_author,
                mod_description: mod_description,
                mod_url: mod_url,
                mod_credits: mod_credits,
                minecraft_version: minecraft_version
        )
    }

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

sourceSets {
    main {
        refMap = "mixins.${mod_id}.refmap.json".toString()

    }
}

mixin {
    config "mixins.${mod_id}.json".toString()
    config "mixins.${mod_id}.minecraft.json".toString()
}

// Example for how to get properties into the manifest for reading by the runtime..
jar {
    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude 'LICENSE.txt', 'META-INF/MANIFSET.MF', 'META-INF/maven/**', 'META-INF/*.RSA', 'META-INF/*.SF'
    }

    manifest {
        attributes([
            "Specification-Title": "Modid:${mod_id}|||ModName:${mod_name}".toString(),
            "Specification-Vendor": "${mod_author}".toString(),
            "Specification-Version": "${mod_version}.toString()", // We are version 1 of ourselves
            "Implementation-Title": "Modid:${mod_id}|||ModName:${mod_name}".toString(),
            "Implementation-Version": "${mod_version}",
            "Implementation-Vendor" :"${mod_author}".toString(),
            "Implementation-Timestamp": "Year:Month:Day---T:Hour:Month:Seconds" + new Date().format("yyyy-MM-dd'---T:'HH:mm:ssZ"),

            'FMLCorePluginContainsFMLMod': true,
            'FMLCorePlugin': "${mixins_forge_core_plugin_path}".toString(),
            'ForceLoadAsMod': true,

            'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
        ])



    }


}




// Example configuration to allow publishing using the maven-publish task
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar')

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
//publish.dependsOn('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar {
                classifier = null // Ensure no classifier is set
            }
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
        maven {
            url "C://Users//Admin//Documents//rclone22modlib_mod_repo"
        }
    }
}



