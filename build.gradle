
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/maven' }
        maven { url = 'https://jitpack.io' }
        maven { url = 'https://plugins.gradle.org/m2' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'

    }
}


apply plugin: 'net.minecraftforge.gradle'

apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'maven'

apply plugin: 'org.spongepowered.mixin'


version = "${mod_version}"
group = "${mod_group}" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "${mod_id}"

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8' // Need this here so eclipse task generates correctly.

minecraft {

    mappings channel: "${mappings_channel}", version: "${mappings_version}"

    runs {
        client {
            workingDirectory project.file('run')


            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            property 'forge.logging.console.level', 'debug'
            arg '-torg.spongepowered.asm.launch.MixinTweaker'
            args '--tweakClass', 'org.spongepowered.asm.launch.MixinTweaker'
            property 'mixins.env.remapRefMap', 'true'

            jvmArgs += "-Dfml.coreMods.load=${mixins_forge_core_plugin_path}"

        }

        server {

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            property 'forge.logging.console.level', 'debug'
            arg '-torg.spongepowered.asm.launch.MixinTweaker'
            args '--tweakClass', 'org.spongepowered.asm.launch.MixinTweaker'

            jvmArgs += "-Dfml.coreMods.load=${mixins_forge_core_plugin_path}"

        }
    }
}


repositories {
    mavenCentral()
    maven {
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'CoFH Maven'
        url = 'https://maven.covers1624.net'
    }

    maven {
        url = 'https://jitpack.io'
    }
    maven {
        name = 'spongepowered-repo'
        url = 'https://repo.spongepowered.org/maven'
    }
    maven {
        url  = 'https://jitpack.io'
    }
}

configurations {
    embed
    compile.extendsFrom(embed)
}

dependencies {

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation files('libs/NTM-Extended-1.12.2-2.0.2.jar')
    implementation files('run/mods/Galacticraft-1.12.2-4.0.7.jar')
    compileOnly files('libs/ToughAsNails-1.12.2-3.1.0.141-universal.jar')
    implementation files('libs/IC2Classic-1.12.2-1.5.11.jar')
    implementation files('libs/ActuallyAdditions-1.12.2-r152.jar')

    embed('org.spongepowered:mixin:0.8.3-SNAPSHOT') {
        exclude module: 'guava'
        exclude module: 'commons-io'
        exclude module: 'gson'
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.3:processor'


  //  implementation ('org.reflections:reflections:0.10.2')

}

ext {
    mod_id = "${mod_id}"
    mod_name = "${mod_name}"
    mod_version = "${mod_version}"
    mod_author = "${mod_author}"
    mod_description = "${mod_description}"
    mod_url = "${mod_url}"
    mod_credits = "${mod_credits}"
    minecraft_version = "${minecraft_version}"
}

processResources {

    inputs.property "version", mod_version
    inputs.property "modid", mod_id

    filesMatching("mcmod.info") {
        expand(
                mod_id: mod_id,
                mod_name: mod_name,
                mod_version: mod_version,
                mod_author: mod_author,
                mod_description: mod_description,
                mod_url: mod_url,
                mod_credits: mod_credits,
                minecraft_version: minecraft_version
        )
    }

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

sourceSets {
    main {
        refMap = "mixins.${mod_id}.refmap.json"
    }
}

mixin {
    config "mixins.${mod_id}.json"
}

// Example for how to get properties into the manifest for reading by the runtime..
jar {
    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude 'LICENSE.txt', 'META-INF/MANIFSET.MF', 'META-INF/maven/**', 'META-INF/*.RSA', 'META-INF/*.SF'
    }

    manifest {
        attributes([
            "Specification-Title": "Modid:${mod_id}|||ModName:${mod_name}",
            "Specification-Vendor": "${mod_author}",
            "Specification-Version": "${mod_version}", // We are version 1 of ourselves
            "Implementation-Title": "Modid:${mod_id}|||ModName:${mod_name}",
            "Implementation-Version": "${mod_version}",
            "Implementation-Vendor" :"${mod_author}",
            "Implementation-Timestamp": "Year:Month:Day---T:Hour:Month:Seconds" + new Date().format("yyyy-MM-dd'---T:'HH:mm:ssZ"),

            'FMLCorePluginContainsFMLMod': true,
            'FMLCorePlugin': "${mixins_forge_core_plugin_path}",
            'ForceLoadAsMod': true,

            'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
            'MixinConfigs': "mixins.${mod_id}.json"
        ])



    }


}




// Example configuration to allow publishing using the maven-publish task
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar')

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
//publish.dependsOn('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar {
                classifier = null // Ensure no classifier is set
            }
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
            // file:///C:/Users/Admin/AppData/Roaming/InteliiJ%20Projects/R22Extras_1.12.2/mcmodsrepo/
        }
    }
}
